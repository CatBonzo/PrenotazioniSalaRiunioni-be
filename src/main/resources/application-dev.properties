# --- DB Docker locale (docker compose up -d) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/prenotazioni}
spring.datasource.username=${DB_USERNAME:smartcity}
spring.datasource.password=${DB_PASSWORD:smartcity}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# JWT secret key
app.jwt-secret=${JWT_SECRET:jwtSecretKeyDeveSuperareLunghezzaMinimaPerHS512AlmenoTrentadueBytesLungo}
 
# Mail credentials
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
 
 
# Configurazione Hikari Connection Pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.idleTimeout=300000
spring.datasource.hikari.maxLifetime=600000
spring.datasource.hikari.leakDetectionThreshold=300000
spring.datasource.hikari.keepaliveTime=60000
spring.datasource.hikari.autoCommit=false
